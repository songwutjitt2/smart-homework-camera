<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Homework — กล้องสด</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#f9f5ff;font:16px system-ui,sans-serif;color:#51446d}.wrap{max-width:650px;margin:30px auto;background:white;padding:24px;border-radius:22px;box-shadow:0 8px 28px #66559922}h1{color:#7657b0;font-size:23px}button{padding:12px 16px;border:0;border-radius:11px;background:#a38ad4;color:white;font:inherit;cursor:pointer;margin:5px}button.secondary{background:#eee7fa;color:#5b4a79}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}#reader{max-width:560px;margin:16px auto}#status{padding:12px;background:#f3edff;border-radius:12px;overflow-wrap:anywhere}small{color:#82758e}</style></head><body><div class="wrap"><h1>📷 Smart Homework — กล้องสด</h1><p>สแกน QR Code นักเรียนผ่านกล้องบนเว็บไซต์ HTTPS</p><button onclick="start()">เปิดกล้อง</button><button class="secondary" onclick="stop()">ปิดกล้อง</button><div id="reader"></div><p id="status">พร้อมเปิดกล้อง</p><label>รหัส QR ล่าสุด</label><input id="code" autocomplete="off" placeholder="ยังไม่ได้สแกน"><div><button onclick="sendBack()">ส่งรหัสกลับระบบ</button><button class="secondary" onclick="copyCode()">คัดลอกรหัส</button></div><small>หากส่งกลับไม่ได้ ให้กดคัดลอกรหัสแล้ววางในช่องรหัสนักเรียนของระบบหลัก ระบบนี้ไม่เก็บรหัสผ่านหรือโทเคนของครู</small></div><script>
let qr=null,last='',lastAt=0;
const el=id=>document.getElementById(id);
function status(s){el('status').textContent=s}
async function start(){if(qr)return;try{qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},raw=>{const code=String(raw||'').trim();if(!code)return;const now=Date.now();if(code===last&&now-lastAt<1800)return;last=code;lastAt=now;el('code').value=code;status('อ่าน QR สำเร็จ: '+code+' — กดส่งรหัสกลับระบบ');},()=>{});status('กล้องพร้อมสแกน QR')}catch(e){qr=null;status('เปิดกล้องไม่สำเร็จ: '+(e.message||e))}}
async function stop(){if(!qr)return;try{await qr.stop();qr.clear()}catch(e){}qr=null;status('ปิดกล้องแล้ว')}
function sendBack(){const code=el('code').value.trim();if(!code){status('ยังไม่มีรหัส QR');return}if(code.length>80){status('รหัสยาวเกิน 80 ตัวอักษร');return}if(!window.opener){status('ไม่พบหน้าระบบหลักที่เปิดกล้องนี้ กรุณาคัดลอกรหัสไปวางในระบบหลัก');return}try{window.opener.postMessage({type:'SMART_HOMEWORK_QR',code},'*');status('ส่งข้อความไปยังหน้าระบบหลักแล้ว กรุณากลับไปตรวจสอบรหัสและกดบันทึก (หากไม่พบรหัสให้คัดลอกแทน)')}catch(e){status('ส่งกลับไม่ได้ กรุณาคัดลอกรหัส')}}
async function copyCode(){const code=el('code').value.trim();if(!code)return status('ยังไม่มีรหัส');try{await navigator.clipboard.writeText(code);status('คัดลอกรหัสแล้ว: '+code)}catch(e){el('code').select();status('เลือกข้อความแล้ว กรุณากด Ctrl+C หรือคัดลอกด้วยตนเอง')}}
</script></body></html>
