<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Homework — กล้องสด</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:16px system-ui,'Tahoma',sans-serif;background:#faf7ff;color:#514568;margin:0;padding:20px}main{max-width:620px;margin:auto;background:white;border:1px solid #eadff5;border-radius:22px;padding:20px;box-shadow:0 10px 25px #44335513}h1{font-size:23px;color:#7555a6}button,select,input{font:inherit;padding:12px;border-radius:11px;border:1px solid #ddd}button{background:#a58bd6;color:white;cursor:pointer;margin:5px}button.secondary{background:#e9e8fb;color:#514568}select,input{width:100%;box-sizing:border-box}label{display:block;margin:15px 0 5px}#reader{max-width:520px;margin:16px auto}#status{padding:14px;border-radius:12px;background:#f1ecfa;overflow-wrap:anywhere}small{color:#777}video{max-width:100%}</style></head><body><main><h1>📷 Smart Homework — กล้องสด</h1><p>หน้าเว็บสแกนแยกจาก Google Apps Script เพื่อให้เบราว์เซอร์ขอสิทธิ์กล้องโดยตรง</p><label for="camera">เลือกกล้อง</label><select id="camera"><option value="">อัตโนมัติ (กล้องหลังถ้ามี)</option></select><button id="find" class="secondary">ค้นหากล้อง</button><button id="start">เปิดกล้อง</button><button id="stop" class="secondary">ปิดกล้อง</button><div id="reader"></div><div id="status" role="status">พร้อมใช้งาน — กดเปิดกล้อง</div><label for="code">รหัส QR ล่าสุด</label><input id="code" readonly placeholder="ยังไม่ได้สแกน"><button id="send" class="secondary">ส่งรหัสล่าสุดกลับระบบ</button><button id="copy" class="secondary">คัดลอกรหัส</button><p><small>หน้านี้ไม่รับรหัสผ่านหรือ token ครู และไม่บันทึกข้อมูลลงฐานข้อมูลโดยตรง ต้องเปิดจากปุ่มในระบบหลักเพื่อส่งรหัสกลับอัตโนมัติ หากเปิดแยกเองให้ใช้ปุ่มคัดลอก</small></p></main><script>
'use strict';
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;
const args=new URLSearchParams(location.hash.slice(1));const nonce=args.get('shs_nonce')||'';const parentOrigin=args.get('shs_origin')||'';
// Do not trust a URL-supplied origin as authorization; the parent validates our exact origin and nonce.
let scanner=null,busy=false,lastCode='',lastTime=0;
function send(code){if(!code)return status('ยังไม่มีรหัส QR');if(window.opener&&!window.opener.closed&&nonce&&parentOrigin){try{window.opener.postMessage({type:'SHS_EXTERNAL_QR_V1',nonce,code},parentOrigin);status('ส่งรหัสกลับระบบหลักแล้ว — โปรดตรวจสอบผลการบันทึกที่หน้าระบบหลัก');return}catch(e){}}status('ไม่สามารถส่งกลับอัตโนมัติได้ กรุณาคัดลอกรหัสไปวางในระบบหลัก')}
async function stop(){if(scanner){let s=scanner;scanner=null;try{await s.stop()}catch(_){}try{await s.clear()}catch(_){}}}
async function cameras(){if(typeof Html5Qrcode==='undefined')return status('โหลดไลบรารีสแกนไม่สำเร็จ');try{const ds=await Html5Qrcode.getCameras();const selected=$('camera').value;$('camera').replaceChildren(new Option('อัตโนมัติ (กล้องหลังถ้ามี)',''),...ds.map((d,i)=>new Option(d.label||'กล้อง '+(i+1),d.id)));if(ds.some(d=>d.id===selected))$('camera').value=selected;status('พบกล้อง '+ds.length+' ตัว');}catch(e){status('ค้นหากล้องไม่ได้: '+(e.message||e))}}
$('find').onclick=cameras;
$('stop').onclick=async()=>{await stop();status('ปิดกล้องแล้ว')};
$('start').onclick=async()=>{if(busy)return;busy=true;try{await stop();if(typeof Html5Qrcode==='undefined')throw Error('โหลดไลบรารีไม่สำเร็จ');scanner=new Html5Qrcode('reader');const id=$('camera').value;await scanner.start(id||{facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const x=Math.min(250,Math.floor(Math.min(w,h)*.75));return {width:Math.max(100,x),height:Math.max(100,x)}}},raw=>{const code=String(raw||'').trim();if(!code)return;const now=Date.now();if(code===lastCode&&now-lastTime<3000)return;lastCode=code;lastTime=now;$('code').value=code;send(code)},()=>{});status('กล้องพร้อมสแกน QR');}catch(e){status('เปิดกล้องไม่สำเร็จ: '+(e.message||e)+' — ตรวจสอบสิทธิ์กล้องและ HTTPS');await stop()}finally{busy=false}};
$('send').onclick=()=>send($('code').value.trim());$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);status('คัดลอกรหัสแล้ว')}catch(e){$('code').select();status('กรุณาคัดลอกรหัสจากช่องด้านบน')}};
window.addEventListener('pagehide',()=>{stop()});
</script></body></html>
